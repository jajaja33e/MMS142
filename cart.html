
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spring | Shopping Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">

        <nav class="navbar navbar-expand-lg">

            <div class="container">

                <a class="navbar-brand" href="index.html">
                    <img src="assets/images/spring-logo.png" alt="Spring logo">
                    Spring
                </a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="mainNavigation">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="shop.html">Shop</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>


    <main>

        <section class="cart-section">

            <div class="container">

                <h1>Shopping Cart</h1>

                <div data-cart-empty>
                    <p>Your cart is currently empty.</p>
                    <a href="shop.html" class="btn product-button">
                        Continue Shopping
                    </a>
                </div>


                <div class="cart-items" data-cart-items>

                    <template id="cart-item-template">

                        <article class="cart-item">

                            <div class="row align-items-center g-3">

                                <div class="col-4 col-md-2">

                                    <img src=""
                                        alt="Cart product"
                                        data-item-image
                                        class="cart-product-image">

                                </div>


                                <div class="col-8 col-md-4">

                                    <h2 data-item-name>Product Name</h2>

                                    <p>
                                        Color:
                                        <span data-item-color></span>
                                    </p>

                                    <p>
                                        Size:
                                        <span data-item-size></span>
                                    </p>

                                    <p data-item-price></p>

                                </div>


                                <div class="col-6 col-md-3">

                                    <label class="form-label">
                                        Quantity
                                    </label>

                                    <input type="number"
                                        class="form-control"
                                        data-item-quantity
                                        min="1"
                                        step="1">

                                </div>


                                <div class="col-6 col-md-3">

                                    <p data-item-total></p>

                                    <button type="button"
                                        class="btn btn-link"
                                        data-remove-item>
                                        Remove
                                    </button>

                                </div>

                            </div>

                        </article>

                    </template>

                </div>


                <div class="cart-summary" data-cart-summary>

                    <h2>Order Summary</h2>

                    <p>
                        Subtotal:
                        <span data-cart-subtotal>₱0.00</span>
                    </p>

                    <p>
                        Delivery:
                        <span data-cart-delivery>To be calculated</span>
                    </p>

                    <h3>
                        Total:
                        <span data-cart-total>₱0.00</span>
                    </h3>

                    <a href="delivery-address.html"
                        class="btn product-button"
                        data-checkout-link>
                        Proceed to Checkout
                    </a>

                </div>


                <a href="shop.html" class="btn">
                    Continue Shopping
                </a>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container">

            <div class="row align-items-center">

                <div class="col-md-6">

                    <a href="index.html" class="footer-brand">
                        <img src="assets/images/spring-logo.png" alt="">
                        Spring
                    </a>

                </div>

                <div class="col-md-6 text-md-end">

                    <p>
                        © 2026 ·
                        <a href="privacy-policy.html">Privacy</a>
                        ·
                        <a href="terms.html">Terms</a>
                    </p>

                </div>

            </div>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>

</body>

</html>
